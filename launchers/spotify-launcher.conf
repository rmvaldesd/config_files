# Configuración de spotify-launcher (se enlaza a ~/.config/spotify-launcher.conf).
#
# El cliente oficial de Spotify es CEF (Chromium embebido) y por defecto arranca
# en XWayland. Con el monitor a escala 2 eso significa render a 1x y upscaling a
# 2x: todo borroso. Estos dos flags lo pasan a Wayland nativo, donde CEF lee el
# scale del wl_output y rasteriza a 2x real.
#
# Ojo: ELECTRON_OZONE_PLATFORM_HINT=wayland (que hyprland.lua ya exporta) NO
# alcanza acá. Esa variable la lee Electron, y Spotify no es Electron sino CEF
# pelado, que sólo mira los flags de línea de comandos.
#
# Detalles y diagnóstico en docs/linux/spotify.md
#
# Los siguientes cuatro flags habilitan la aceleración por hardware (VA-API) con
# el iHD driver (intel-media-driver, ver archdesktopinstall.sh sección 3):
# decodificación/codificación de video por GPU en vez de por CPU. Van todos
# adentro del MISMO --enable-features (Chromium/CEF sólo se queda con la ÚLTIMA
# ocurrencia de un switch repetido, así que un --enable-features separado
# PISARÍA a UseOzonePlatform en vez de sumarse). Verificado con `strings` sobre
# libcef.so que instala spotify-launcher (Chrome/146): los nombres son
# 'AcceleratedVideoDecodeLinuxGL' y 'AcceleratedVideoEncoder' -- el prefijo
# viejo 'Vaapi*' ya no existe en este binario. Detalles en docs/linux/vaapi.md.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoEncoder", "--ozone-platform=wayland", "--ignore-gpu-blocklist", "--enable-gpu-rasterization", "--enable-zero-copy"]
