# Valores por defecto de scripts/rclone-sync. VERSIONADO: lo que pongas acá aplica a
# TODAS las máquinas que usen este repo.
#
# Para cambiar algo sólo en este computador, editá ~/.config/rclone-sync.conf, que se
# lee después y pisa a este archivo. Ese sí es propio de la máquina y no está en git
# (el instalador lo crea la primera vez).
#
# Después de editar el intervalo no hace falta reiniciar nada: el demonio relee esta
# configuración en cada vuelta. Cualquier otro cambio (carpeta, remoto, filtros) sí
# conviene acompañarlo de:  systemctl --user restart rclone-sync

# Carpeta local y remoto de rclone a mantener iguales, en ambos sentidos.
DIR_LOCAL="$HOME/home-laptop"
REMOTO="gdrive:/home-laptop"

# Segundos entre sincronizaciones. ESTE es el número que vas a querer tocar.
# Ojo con bajarlo mucho: cada vuelta lista los dos lados y consume cuota de la API de
# Drive. Por debajo de ~30s no se gana nada real.
INTERVALO=60

# Intentos dentro de una misma vuelta antes de dar la barra por fallida, y espera base
# entre ellos (crece: 10s, 20s, 30s...).
REINTENTOS=3
ESPERA_REINTENTO=10

# Enfriamiento mínimo entre dos --resync automáticos, en segundos (5 min). Sólo aplica
# si el resync anterior TAMPOCO logró sincronizar; ver resync_permitido() en el script.
ESPERA_RESYNC=300

# Qué versión gana un conflicto. 'newer' = la más reciente por fecha de modificación.
# El perdedor NUNCA se borra: queda al lado como archivo.conflict1.
MODO_CONFLICTO=newer
MODO_RESYNC=newer

# 1 = avisar por notificación de escritorio cuando el estado pasa a error (y cuando se
# recupera). 0 = sólo el color del módulo en waybar.
NOTIFICAR=1

# Señal para refrescar waybar al instante. Tiene que coincidir con el "signal" del
# módulo custom/rclone en dotconfig/waybar/config.jsonc.
SENAL_WAYBAR=8

# Archivo con las rutas a excluir. Dejalo en "" para sincronizar todo.
# OJO: bisync guarda un hash de este archivo. Si lo editás, la siguiente vuelta va a
# fallar pidiendo un --resync -- el script lo detecta y lo hace solo, pero la primera
# pasada después de tocar los filtros tarda más.
FILTROS="$HOME/config_files/scripts/rclone-sync-filtros.txt"
