# Que cerrar la tapa NO suspenda el equipo si está enchufado.
#
# /etc/systemd/logind.conf viene vacío (sólo la cabecera [Login]), así que rigen los
# defaults de systemd, y los defaults suspenden en los dos casos:
#
#   HandleLidSwitch=suspend
#   HandleLidSwitchExternalPower=suspend   <-- suspende TAMBIÉN con cargador
#
# Diagnosticado el 2026-08-12: el equipo se pasaba horas suspendido con el cargador
# puesto. En el journal se ve la cadena completa: "Lid closed." -> "Suspending..." ->
# NetworkManager en estado DISABLED (ASLEEP) -> hasta 30 h sin red de un tirón.
#
# OJO, ESTO NO LO CUBRÍA hypridle. El listener 5 de hypr/hypridle.conf chequea
# A*/online justamente para suspender sólo en batería, pero el cierre de tapa nunca
# pasa por hypridle: lo maneja logind directo, y logind no consulta el cargador. Este
# archivo es lo que hace que la intención ya documentada en hypridle.conf valga también
# para la tapa. Si algún día parecen contradecirse, es esto: son dos caminos distintos
# al mismo suspend.
#
# En batería se sigue suspendiendo al cerrar, porque HandleLidSwitch (sin sufijo) queda
# en su default 'suspend'. Y el bloqueo por inactividad no se toca: sigue siendo de
# hypridle.
#
# Se aplica con 'systemctl reload systemd-logind', NO con restart: verificado que
# CanReload=yes en systemd 261, así que el reload no corta la sesión gráfica. Un
# restart sí la mataría.
[Login]
HandleLidSwitchExternalPower=ignore
