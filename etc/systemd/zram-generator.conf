# zram config for the swap that the kernel actually compresses.
#
# The machine hit this the hard way: after 7 days up, /dev/zram0 was 100% FULL (4G of data
# compressed into 1.1G) and the 8G swapfile was already 2.2G in, with pswpout at 22 million
# pages. Memory pressure showed 'full' > 0, meaning every task was stalling on the fault
# path at once -- that is what froze the mouse in bursts.
#
# A 4G zram on a 16G machine is small. zram is ~free capacity here because it is compressed
# RAM; let it grow so it absorbs the compressed working set before the kernel reaches for
# the slow swapfile on the SSD.
#
# zram-generator sizes the device with the value below; 'min(ram / 2)' means 8G of RAM on
# this 16G box, capped so a machine with lots of RAM does not build an absurd device.
# zstd is kept: it is the best ratio of the options offered, and the CPU cost is negligible
# on this CPU compared to the SSD round trip it avoids.
[zram0]
zram-size = min(ram / 2, 12288)
compression-algorithm = zstd
swap-priority = 100
