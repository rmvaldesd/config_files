# VM tuning for a 16G laptop that runs Chrome + Java + Electron all day.
#
# Applied by archdesktopinstall.sh (section: VM tuning). Drop-in under /etc/sysctl.d so it
# is read on every boot and on 'sysctl --system'.
#
# WHY THESE VALUES:
#
# vm.swappiness = 100
#   The default (60) assumes the swap device is a slow disk and tries hard to keep anonymous
#   pages in RAM. Here the primary swap is zram -- COMPRESSED RAM, which is far faster than
#   the SSD swapfile and about as fast as RAM for a page that compresses well. Pushing
#   cold anonymous pages into zram early keeps more of RAM as page cache (where the real
#   working set lives) instead of evicting file pages to make room. This was the single
#   thing that changed the machine from "swapfile thrash" to "zram absorbs it".
#   NOTE: with zram present the kernel already weights it well, so this is a nudge, not a
#   rescue; if a future kernel changes the default, revisit this number with gpumemwatch
#   style before/after, the same way the GPU driver change is measured.
#
# vm.vfs_cache_pressure = 50
#   Default 100 reclaims dentries/inodes as aggressively as file pages. On a desktop with a
#   few big projects open, those caches are used constantly (git, compilers, editors), so
#   dropping them just means re-reading the same directories from disk. 50 keeps them.
#
# vm.watermark_boost_factor = 0
#   Left at the kernel default on purpose; listed here only to record that it was NOT
#   touched. Boosting watermarks makes the kernel free memory more eagerly (more stalling)
#   which is the opposite of what this machine needs.
#
# These do NOT replace fixing the load: 15G with Chrome renderers at 400-700M each means a
# reboot still clears the leak, and closing tabs still helps more than any of this.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
