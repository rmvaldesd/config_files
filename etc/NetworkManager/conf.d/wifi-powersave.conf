# Desactiva el ahorro de energía de la tarjeta wifi.
#
# El driver iwlwifi trae el ahorro ACTIVADO por defecto y NetworkManager no lo toca
# (802-11-wireless.powersave queda en 0 = "default", que significa "no me meto").
# Con eso la tarjeta se duerme entre beacons, se pierde de más de los que tolera y el
# kernel corta el enlace:
#
#   iwlwifi: missed beacons exceeds threshold, but receiving data.
#            Stay connected, Expect bugs.
#   wlp0s20f3: Connection to AP ... lost (reason=4 locally_generated=1)
#
# Diagnosticado el 2026-08-12: 172 de esos eventos en 6 días, con la señal en 70/100
# (o sea que NO era falta de cobertura). Cada corte tumbaba las peticiones HTTP largas
# en curso -- se notaba como errores de API de Claude cada un par de horas.
#
# Peor todavía: cada pérdida de beacons hacía saltar al cliente a otro nodo de la malla
# y volver al original 14-35 s después, así que cada evento eran DOS desconexiones con
# dos reinicios de DHCP, no una.
#
# Valores de wifi.powersave: 2 = desactivado, 3 = activado.
# Cuesta algo de batería; a cambio el enlace no se cae.
#
# Verificado después de aplicarlo:  iw dev <iface> get power_save  ->  "Power save: off"
[connection]
wifi.powersave = 2
