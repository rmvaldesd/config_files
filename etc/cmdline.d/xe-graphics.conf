# Fuerza el driver de la iGPU Intel Meteor Lake-P (8086:7d45) del T14 Gen 5.
#
# POR QUÉ HACE FALTA: en kernel 7.x los módulos i915 y xe reclaman los dos el mismo
# device y xe gana por defecto. O sea que este archivo NO cambia el driver activo
# respecto al default actual: lo FIJA, para que una actualización de kernel que
# invierta esa preferencia no te cambie el driver por debajo sin avisar.
#
# --- PROBANDO i915 (2026-10-09) ---------------------------------------------------------
# xe acumulo 35 'TLB invalidation fence timeout' en 7 dias, con la pantalla pegandose ~1s
# y el mouse congelandose a ratos. gpumemwatch ya tenia 9347 muestras de xe, asi que ahora
# se cambia a i915 para tener la comparacion que ese tool existe para hacer.
#
# OJO, esto es un EXPERIMENTO, no un arreglo obvio: la variante del MISMO bug en i915 es
# PEOR (cuelgue duro tras resume de s2idle), y por eso el texto original de este archivo
# recomendaba no cambiarlo a la ligera. Si aparece cualquiera de estos sintomas, volver a
# xe invirtiendo las banderas otra vez:
#   - cuelgue duro (no un tirón de 1s) al despertar de suspension
#   - pantalla negra o congelada al volver del suspend
#   - mas 'TLB invalidation fence timeout' que con xe
#
# Medir SIEMPRE antes de sacar conclusiones:
#   gpumemwatch report              # comparacion por driver, con los datos ya juntados
#   journalctl -b -k | grep -c 'TLB invalidation fence timeout'
#
# CÓMO REVERTIR A xe: INVERTIR las banderas, NO borrar el archivo (borrarlo deja el
# default, que es xe, pero no lo fija). Comentar la linea activa, descomentar la otra,
# 'sudo mkinitcpio -P' y reiniciar.
#
# Verificar qué driver quedo activo de verdad, no asumirlo:
#   cat /proc/cmdline
#   lspci -nnk -s 00:02.0     # mirar "Kernel driver in use"
#
# OJO con el formato: mkinitcpio descarta las lineas que empiezan con '#', pero NO los
# comentarios al final de una linea con parametros; eso se inyectaria al cmdline.
i915.force_probe=7d45 xe.force_probe=!7d45