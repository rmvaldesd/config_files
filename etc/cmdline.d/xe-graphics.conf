# Fuerza el driver 'xe' para la iGPU Intel Meteor Lake-P (8086:7d45) del T14 Gen 5.
#
# POR QUÉ HACE FALTA: en kernel 7.x los módulos i915 y xe reclaman los dos el mismo
# device y xe gana por defecto. O sea que este archivo NO cambia el driver activo
# respecto al default actual: lo FIJA, para que una actualización de kernel que
# invierta esa preferencia no te cambie el driver por debajo sin avisar.
#
# CÓMO REVERTIR A i915: hay que INVERTIR las banderas, NO borrar el archivo. Si lo
# borrás, xe sigue ganando por default y no pasa nada. Comentá la línea activa y
# descomentá la otra, después 'sudo mkinitcpio -P' y reiniciá:
#
#   xe.force_probe=!7d45 i915.force_probe=7d45
#
# ANTES de revertir, mirá los datos: 'gpumemwatch report'. El bug conocido de xe acá
# son los 'TLB invalidation fence timeout' que pegan la pantalla ~1s (timeout de
# HZ/4 = 250ms + latencia CTB, sin reset de GPU). La variante del MISMO bug en i915
# es PEOR: cuelgue duro tras resume de s2idle. No es un cambio obviamente ganador.
#
# Verificá siempre qué driver quedó activo de verdad, no lo asumas:
#   cat /proc/cmdline
#   lspci -nnk -s 00:02.0     # mirá la línea "Kernel driver in use"
#
# OJO con el formato: mkinitcpio descarta las líneas que empiezan con '#', pero NO
# los comentarios al final de una línea con parámetros; eso se inyectaría al cmdline.
i915.force_probe=!7d45 xe.force_probe=7d45
