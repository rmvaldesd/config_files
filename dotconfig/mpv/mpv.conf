# mpv — reproductor de video/audio del escritorio
#
# Las asociaciones de archivo NO están acá: viven en el mimeapps.list de la raíz del
# repo, que manda todos los video/* y audio/* a mpv.desktop. Y ese .desktop es el que
# trae el paquete de Arch tal cual, sin override en applications/, porque ya lanza
# 'mpv --player-operation-mode=pseudo-gui': al abrir un archivo desde Thunar aparece
# con controles en pantalla en vez de comportarse como reproductor de terminal.
#
# Referencia de cualquier opción de acá: 'man mpv'.

# --- Calidad de imagen ---
#
# Activa el escalado ewa_lanczossharp y el tone mapping fino de HDR
# (hdr-peak-percentile=99.995 + hdr-contrast-recovery=0.30).
#
# 'high-quality' es el nombre VIGENTE del viejo 'gpu-hq': mpv lo renombró en 0.37 y
# hoy 'gpu-hq' quedó como alias de compatibilidad -- literalmente, su definición es
# 'profile=high-quality', comprobable con 'mpv --show-profile=gpu-hq'. Los dos hacen
# lo mismo; se escribe el nuevo para no depender de un alias que en algún momento se
# puede ir.
#
# El vo (driver de salida de video) no se fija a propósito: mpv autodetecta y elige
# gpu-next, el renderer sobre libplacebo, que es el primero de 'mpv --vo=help' y el
# que corresponde en Wayland. Fijarlo a mano sólo sirve para quedar clavado en un
# default viejo cuando upstream lo cambie.
profile=high-quality

# --- Decodificación por hardware ---
#
# mpv la trae APAGADA de fábrica, para que la config de origen funcione en cualquier
# equipo aunque el driver del sistema sea dudoso. Prenderla baja el uso de CPU y el
# consumo, y en material pesado (4K60 AV1) directamente hace falta.
#
# 'auto' se limita a los backends que el equipo de mpv mantiene activamente y cae a
# software si ninguno sirve; el que prueba TODOS es 'auto-unsafe', y sólo tiene
# sentido si 'auto' no alcanzó. En este equipo (Intel Arc Pro 130T/140T, Arrow Lake)
# 'auto' resuelve a VA-API contra el driver iHD de intel-media-driver, que es el
# mismo paquete que ya instala la sección de drivers del instalador.
#
# Para confirmar que enganchó, en una terminal:
#
#   mpv --hwdec=auto -v archivo.mp4 2>&1 | grep -i "Trying hardware decoding"
#
# y con el video abierto, Ctrl+h alterna hwdec entre auto y no en caliente, por si
# algún archivo puntual se ve mal y hay que descartar el decodificador.
hwdec=auto
