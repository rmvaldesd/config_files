# Configuracion de foot.
# Vive en ~/config_files/dotconfig/foot y se enlaza como ~/.config/foot
# desde archdesktopinstall.sh (seccion 9).
#
# La paleta es la misma que usan ghostty, waybar (style.css) y mako: escala zinc
# (#18181b / #27272a / #3f3f46 / #52525b) con acento cyan #75f1fa y el rojo
# #e35149 de los estados urgentes.

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=10x8
dpi-aware=yes

[cursor]
style=block
blink=yes

[colors-dark]
background=27272a
foreground=fafafa
cursor=fafafa 75f1fa

# Seleccion
selection-foreground=fafafa
selection-background=52525b

# Paleta ANSI 0-7: colores normales
# El negro es #18181b (el @dark-9 de la barra): tiene que ser MAS oscuro que
# el fondo, si no el texto en color 0 quedaria invisible.
regular0=18181b
regular1=e35149
regular2=7ee787
regular3=e3b341
regular4=79c0ff
regular5=d2a8ff
regular6=75f1fa
regular7=d4d4d8

# Paleta ANSI 8-15: variantes brillantes
bright0=52525b
bright1=ff7b72
bright2=8ef0a0
bright3=f0c674
bright4=a5d6ff
bright5=e2c5ff
bright6=a5f6fc
bright7=fafafa

[mouse]
hide-when-typing=yes
