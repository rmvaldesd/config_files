general {
    # Evita que se lancen múltiples instancias de bloqueo al mismo tiempo
    lock_cmd = pidof hyprlock || hyprlock       
    # Comando que se ejecuta antes de suspender el sistema (asegura que se bloquee primero)
    before_sleep_cmd = loginctl lock-session    
    # Comando que se ejecuta después de despertar del modo suspensión
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# OJO CON LA SINTAXIS DE hyprctl dispatch EN ESTE ARCHIVO
# Hay DOS trampas acá, y las dos fallan en silencio (hyprctl devuelve exit 0 igual, así
# que hypridle cree que el comando anduvo).
#
# 1) La config de Hyprland de este equipo es en LUA (hyprland.lua), y eso cambia cómo se
#    invoca 'hyprctl dispatch': la forma clásica 'hyprctl dispatch dpms off' se
#    interpreta como CÓDIGO LUA y falla con "')' expected near 'off'". Por eso la
#    pantalla se bloqueaba pero NUNCA se apagaba. La forma correcta es
#    hl.dsp.<dispatcher>({ ... }), entre comillas simples para que las dobles de adentro
#    lleguen intactas a la shell.
#
# 2) El campo del parámetro se llama 'action', NO 'state'. Está en el header de Hyprland,
#    /usr/include/hyprland/src/config/lua/bindings/LuaBindingsInternal.hpp:
#        tableToggleAction(lua_State* L, int idx, const char* field = "action");
#        enum eTogglableAction { TOGGLE_ACTION_TOGGLE = 0, ENABLE, DISABLE };
#    Si le pasás una clave que no conoce (como 'state'), no encuentra el campo y cae al
#    valor 0, que es TOGGLE. O sea que dpms({ state = "on" }) NO enciende: ALTERNA. En la
#    alternancia on/off de hypridle eso parece funcionar de casualidad, pero cualquier
#    invocación de más apaga la pantalla en vez de encenderla -- por ejemplo el
#    after_sleep_cmd de acá arriba, que al despertar corre con la pantalla ya encendida
#    y la habría apagado.
#    Verificado: con 'action' es idempotente (dos 'off' seguidos dejan false, dos 'on'
#    seguidos dejan true); con 'state' un 'on' sobre una pantalla encendida la apaga.

# 1. Atenuar la pantalla como AVISO de que está por bloquear (1 minuto antes)
# '-s' guarda el brillo actual antes de bajarlo y '-r' lo restaura tal cual estaba.
# No usar 'set 100%' en on-resume: pisaría tu brillo real, subiéndolo a tope aunque
# lo tuvieras al 60%. Y ojo: 'set 10%-' NO es "poner al 10%", es restar 10 puntos.
listener {
    timeout = 540                                 # 9 minutos
    on-timeout = brightnessctl -s set 10%         # Guarda el brillo actual y baja al 10%
    on-resume = brightnessctl -r                  # Restaura el brillo que tenías
}

# 2. Apagar el backlight del teclado (ahorro puro, sin molestia perceptible)
# El nombre del dispositivo depende del hardware: en este ThinkPad es
# 'tpacpi::kbd_backlight'. Verificá el tuyo con 'brightnessctl -l' si cambiás de equipo.
listener {
    timeout = 150                                 # 2.5 minutos
    on-timeout = brightnessctl -d tpacpi::kbd_backlight -s set 0  # Apaga el backlight
    on-resume = brightnessctl -d tpacpi::kbd_backlight -r         # Restaura su nivel previo
}

# 3. Bloquear la pantalla de forma segura
listener {
    timeout = 600                                 # 10 minutos
    on-timeout = loginctl lock-session            # Lanza hyprlock mediante systemd/loginctl
}

# 4. Apagar la pantalla por completo (DPMS)
# El timeout tiene que ser MAYOR al del bloqueo: si la pantalla se apaga antes,
# queda negra pero la sesión sigue desbloqueada y basta mover el mouse para entrar.
listener {
    timeout = 630                                 # 10.5 minutos (justo después de bloquear)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # Apaga la señal de video
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # La enciende al mover mouse/teclado
}

# 5. Suspender el equipo SOLO si está usando batería
# Va 5 minutos después del bloqueo: si coincidiera con él, en batería el equipo
# se suspendería en el mismo instante en que bloquea y nunca verías el bloqueo.
listener {
    timeout = 900                                 # 15 minutos
    # Verifica si el cargador está desconectado antes de suspender.
    # El glob A*/online cubre los distintos nombres según hardware: AC, AC0, ACAD, ADP1 (la batería es BAT*, no matchea)
    on-timeout = grep -q 0 /sys/class/power_supply/A*/online 2>/dev/null && systemctl suspend
}
