# Fondo de pantalla (lo lanza el autostart de hyprland.lua).
#
# OJO con la sintaxis: hyprpaper 0.8.0 se reescribió sobre hyprtoolkit y rompió
# el formato viejo. Las líneas 'preload = ruta' y 'wallpaper = monitor,ruta' ya
# no existen: hyprpaper arranca igual, no imprime ningún error de parseo, y deja
# el escritorio sin fondo con un solo DEBUG discreto por stderr
# ("Monitor eDP-1 has no target: no wp will be created"). Si el fondo desaparece
# después de una actualización, este archivo es el primer sospechoso.
#
# path acepta un DIRECTORIO, así que hyprpaper elige solo. Para sumar fondos
# alcanza con copiar imágenes a wallpapers/: entran solas en la rotación, sin
# tocar nada de esta configuración.

wallpaper {
    # Monitor vacío = aplica a todos los monitores.
    monitor =

    path = ~/config_files/wallpapers

    # order = random elige al azar en cada arranque de hyprpaper, o sea en cada
    # login. Sin timeout la imagen elegida se queda fija toda la sesión; agregá
    # 'timeout = 600' acá si preferís que además vaya cambiando cada 10 minutos.
    order = random

    # cover llena la pantalla recortando lo que sobra, en vez de dejar bandas
    # cuando la imagen no tiene la proporción del monitor.
    fit_mode = cover

    # Sin recursive: solo el primer nivel de wallpapers/.
    recursive = 0
}
