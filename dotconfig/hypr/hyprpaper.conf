# FALLBACK. El autostart de hyprland.lua NO usa este archivo: llama a
# bin_configs/hyprpaper-random, que elige una imagen al azar de
# config_files/wallpapers y genera un config en el directorio de runtime.
#
# Este queda para cuando ejecutes 'hyprpaper' a secas, sin -c, que es la ruta
# que lee por defecto. Como fija un nombre de archivo concreto, si renombrás esa
# imagen este fallback deja de funcionar (el script no, porque no depende del
# nombre).
preload = ~/config_files/wallpapers/arch-linux-wallpaper.png

# Monitor vacío = aplica a todos los monitores
wallpaper = , ~/config_files/wallpapers/arch-linux-wallpaper.png

# No mantener wallpapers no usados en memoria
ipc = off
