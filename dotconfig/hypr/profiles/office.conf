# PERFIL OFICINA -- el más restrictivo. Es el que se aplica por defecto.
#
# En oficina el riesgo real no es la batería: es la pantalla desatendida con gente
# alrededor. Por eso el bloqueo baja a 5 minutos. Los otros tiempos se derivan de
# ese número manteniendo las relaciones que explica hypridle.conf.
#
# Para cambiar de perfil no edites este archivo: usá 'hypridle-profile home'.

$WARN    = 240    # 4 min    -- atenúa la pantalla 1 minuto ANTES de bloquear
$LOCK    = 300    # 5 min    -- el número que importa
$DPMS    = 330    # 5.5 min  -- SIEMPRE después de $LOCK (ver hypridle.conf)
$SUSPEND = 600    # 10 min   -- sólo dispara si está en batería
