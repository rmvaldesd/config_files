# PERFIL CASA -- el relajado. Hay que elegirlo a mano con 'hypridle-profile home'.
#
# En casa no hay terceros mirando la pantalla, así que el bloqueo a los 10 minutos
# molesta menos y no cuesta nada en seguridad real. Son los valores originales de
# este equipo antes de que existieran los perfiles.
#
# Este archivo NUNCA se aplica solo: si el symlink active.conf falta o apunta a la
# nada, hypridle cae en los valores inline de hypridle.conf, que son los de oficina.
# El default siempre es el perfil más seguro, nunca éste.

$WARN    = 540    # 9 min     -- atenúa la pantalla 1 minuto ANTES de bloquear
$LOCK    = 600    # 10 min    -- el número que importa
$DPMS    = 630    # 10.5 min  -- SIEMPRE después de $LOCK (ver hypridle.conf)
$SUSPEND = 900    # 15 min    -- sólo dispara si está en batería
